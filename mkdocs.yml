site_name: Thapar Auto
site_description: Campus auto booking and pooling for Thapar Institute, with 20 stops, seat-level booking and ride history.
site_url: https://tmittal24.github.io/UCS503P-202627-Thapar-Auto-Project/

repo_url: https://github.com/tmittal24/UCS503P-202627-Thapar-Auto-Project
repo_name: UCS503P-202627-Thapar-Auto-Project

plugins:
  - search
  - literate-nav:
      nav_file: summary.md
  - section-index
  - git-revision-date-localized
  - git-authors
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_full_path: true
            show_root_heading: true
            show_source: false

theme:
  name: material
  custom_dir: docs/assets/theme-overrides
  font:
    text: Figtree
    code: JetBrains Mono
  features:
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png

copyright: "UCS503P Software Engineering project, Thapar Institute of Engineering and Technology"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tmittal24/UCS503P-202627-Thapar-Auto-Project
      name: Project repository

extra_css:
  - assets/stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css
extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - javascript/arithmatex.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      custom_inline:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_inline_format {which: generic}
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {which: generic}
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
